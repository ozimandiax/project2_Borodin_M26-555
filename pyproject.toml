[project]
name = "primitive-db"
version = "0.2.0"
description = "Примитивная консольная база данных на Python"
readme = "README.md"
authors = [
    { name = "Ozimandiax", email = "vovatankist2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
